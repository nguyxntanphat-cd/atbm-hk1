<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#263445;background:#f3f5f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;font-size:14px;line-height:1.6}a{color:#275a89;text-decoration:none}a:hover{text-decoration:underline}.topbar{background:#fff;border-bottom:1px solid #dfe5eb}.topbar-inner{max-width:1100px;margin:auto;min-height:68px;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px;color:#263445;font-weight:650;font-size:16px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;background:#315f85;color:#fff;border-radius:7px;font-size:13px;letter-spacing:.5px}.brand small{display:block;font-size:11px;font-weight:400;color:#7b8794;line-height:1.3}.nav{display:flex;gap:20px;align-items:center;font-size:13px}.nav .active{color:#263445;font-weight:600}.container{max-width:1000px;margin:34px auto;padding:0 24px}.wide{max-width:1150px}.page-heading{margin-bottom:24px}.eyebrow{font-size:11px;color:#738297;text-transform:uppercase;letter-spacing:1.3px;font-weight:600;margin-bottom:5px}h1{font-size:26px;line-height:1.3;margin:0 0 8px;font-weight:650;letter-spacing:-.5px}h2{font-size:16px;margin:0 0 5px;font-weight:650}h3{font-size:16px;margin:0 0 12px}p{margin:0 0 16px}.muted,.hint{color:#738092}.hint{font-size:12px;margin:6px 0 0}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,1fr);gap:22px;align-items:start}.card{background:#fff;border:1px solid #dfe5eb;border-radius:9px;overflow:hidden}.card-header{padding:19px 22px;border-bottom:1px solid #edf0f3}.card-body{padding:22px}.field{margin-bottom:18px}.field label,.field-label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}input:not([type=checkbox]),select{width:100%;min-width:0;background:#fff;border:1px solid #cdd6df;border-radius:5px;padding:10px 11px;color:#263445;font:inherit;line-height:1.4}input::placeholder{color:#98a1ac}input:focus,select:focus{outline:2px solid #b9d3e8;outline-offset:1px;border-color:#648bac}input[type=file]{padding:16px!important;border-style:dashed!important;background:#fafbfd!important;font-size:13px!important}input[type=file]::file-selector-button{background:#eaf0f5;border:0;border-radius:4px;padding:7px 10px;color:#385772;margin-right:12px;cursor:pointer}button{font:inherit;border:1px solid #ccd6df;border-radius:5px;background:#fff;color:#345875;padding:7px 12px;cursor:pointer}button:hover{background:#edf3f8}.primary{background:#315f85;border-color:#315f85;color:#fff;padding:11px 18px;font-weight:600}.primary:hover{background:#264e70}.full{width:100%}.note{background:#f1f5f8;border-left:3px solid #91abc0;padding:13px 15px;font-size:13px;color:#5c6c7d;margin-bottom:20px}.steps{margin:15px 0 0;padding-left:21px;color:#627184;font-size:13px}.steps li{padding:5px 0 5px 4px}.badge{font-size:11px;padding:3px 8px;border-radius:4px;background:#edf3f7;color:#526f85;white-space:nowrap}pre{font:12px/1.8 Consolas,monospace;background:#f7f9fb;border:1px solid #e3e9ef;border-radius:5px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto;margin:14px 0 0}pre:empty:before{content:attr(data-empty);font-family:Segoe UI,Arial,sans-serif;color:#8a96a3}.footer{max-width:1100px;margin:34px auto 20px;padding:16px 24px;border-top:1px solid #dfe5eb;color:#8a94a1;font-size:12px;display:flex;justify-content:space-between;gap:12px}.login-wrap{max-width:420px;margin:60px auto;padding:0 20px}.login-wrap .page-heading{text-align:center;margin-bottom:25px}.login-wrap .card-body{padding:26px}.login-wrap h1{font-size:24px}.demo{margin-top:20px;padding-top:17px;border-top:1px solid #e9edf1;font-size:12px;color:#6e7d8d}.account{display:flex;justify-content:space-between;padding-top:7px}code{font-family:Consolas,monospace;background:#edf2f6;padding:2px 5px;border-radius:3px}#err{color:#ba4141;font-size:13px;min-height:22px;margin-top:10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.toolbar .field{margin:0;flex:1;max-width:330px}.check{font-size:13px;color:#617184;display:flex;align-items:center;gap:8px}.check input{accent-color:#315f85;width:15px;height:15px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{background:#f7f9fb;color:#758193;font-size:11px;font-weight:600;white-space:nowrap;padding:12px 16px;border-bottom:1px solid #e2e7ed}td{font-size:13px;padding:14px 16px;border-bottom:1px solid #edf0f3;vertical-align:middle}tbody tr:hover{background:#fafcfd}td:last-child{white-space:nowrap}td button{font-size:12px;padding:4px 9px}td a{font-size:12px;margin-left:5px}.table-note{padding:11px 16px;font-size:12px;color:#8a96a3}.preview{margin-top:22px}.preview pre{min-height:100px}.preview h3:empty{display:none}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}.container{margin-top:24px;padding:0 16px}.topbar-inner{padding:13px 16px;align-items:flex-start}.brand{font-size:14px}.nav{gap:12px;flex-wrap:wrap;justify-content:flex-end;font-size:12px}.brand small{max-width:150px}.card-body,.card-header{padding:18px}h1{font-size:23px}.footer{margin-top:25px;padding:16px;flex-wrap:wrap}.login-wrap{margin-top:35px}.toolbar{align-items:flex-start}.toolbar .field{max-width:none;flex-basis:100%}}
button:disabled{opacity:.55;cursor:wait}input[readonly]{background:#f3f5f7;color:#637284}#listStatus{margin:0}[role="status"]{overflow-wrap:anywhere}</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/"><span class="brand-mark">AT</span><span>Tài liệu nội bộ<small>Đồ án An toàn bảo mật HTTT</small></span></a><nav class="nav" aria-label="Điều hướng"><span class="badge">RSA + AES</span></nav></div></header><main class="login-wrap"><div class="page-heading"><div class="eyebrow">Chào mừng bạn</div><h1>Đăng nhập hệ thống</h1><p class="muted">Gửi và nhận tài liệu trong nội bộ.</p></div><section class="card"><div class="card-body"><form><div class="field"><label for="username">Tên đăng nhập</label><input id="username" placeholder="Nhập tên đăng nhập" autocomplete="username" required autofocus></div><div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required></div><button class="primary full" type="submit">Đăng nhập</button></form><div id="err" role="alert"></div><div class="demo"><b>Tài khoản dùng thử</b><div class="account"><span>Nhân viên</span><span><code>nhanvien</code> / <code>123456</code></span></div><div class="account"><span>Boss</span><span><code>boss</code> / <code>admin123</code></span></div><div class="account"><span>Quản trị</span><span><code>quantri</code> / <code>quantri123</code></span></div></div><!-- end-demo --></div></section></main><footer class="footer"><span>Đồ án ATBM · Truyền tải dữ liệu nội bộ</span><span>RSA-2048 / AES-256-GCM</span></footer>
