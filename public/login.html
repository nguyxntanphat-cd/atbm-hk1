<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đăng nhập · Truyền tải dữ liệu nội bộ (RSA + AES)</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="login-page">
  <section class="login-box">
    <h1>Đăng nhập hệ thống</h1>
    <p>Ứng dụng mã hóa RSA-OAEP và AES-256-GCM trong truyền tải dữ liệu nội bộ.</p>

    <form onsubmit="login(event)">
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input class="input" id="username" placeholder="Tên tài khoản" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input class="input" id="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
      </div>
      <div id="err" class="notice error" role="alert"></div>
      <button id="submit" class="btn btn-primary" type="submit" style="width:100%;margin-top:8px">Đăng nhập</button>
    </form>

  </section>
</main>
<script>
async function login(e) {
  e.preventDefault();
  const b = document.querySelector('#submit');
  const err = document.querySelector('#err');
  b.disabled = true;
  b.textContent = 'Đang kiểm tra…';
  err.className = 'notice error';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.querySelector('#username').value.trim(),
        password: document.querySelector('#password').value
      })
    });
    const j = await r.json();
    if (!r.ok) throw Error(j.error || 'Đăng nhập thất bại');
    location.href = j.redirect;
  } catch (x) {
    err.textContent = x.message;
    err.className = 'notice error show';
    b.disabled = false;
    b.textContent = 'Đăng nhập';
  }
}
</script>
</body>
</html>
